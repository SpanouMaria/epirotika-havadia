<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style/style.css"
    >

    <title>
        Ηπειρώτικα Χαβάδια
    </title>

</head>

<body>

    <section class="welcome-body transition-page">

        <main class="welcome-screen">

            <h1 class="welcome-title">
                Καλώς ήρθατε!
            </h1>

            <img
                src="../assets/logo/logo.png"
                alt="Χαβάδια"
                class="main-logo"
            >

            <div class="bottom-info">

                <div class="sponsor-box">

                    <p class="bottom-label">
                        Χορηγός:
                    </p>

                    <img
                        src="../assets/logo/bank.png"
                        class="bank-logo"
                    >

                </div>

                <div class="organizer-box">

                    <p class="bottom-label">
                        Διοργάνωση:
                    </p>

                    <img
                        src="../assets/logo/logo.png"
                        class="small-logo"
                    >

                </div>

            </div>

        </main>

    </section>

    <section class="page">

        <main class="puzzle-grid transition-page">

            <a
                href="pages/program.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Πρόγραμμα-Στίχοι
                </span>

            </a> 

            <a
                href="pages/drop.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Ήχοι
                </span>

            </a>   

            <a
                href="pages/credits.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Συντελεστές
                </span>

            </a> 

        </main>

    </section>

</body>

</html>
