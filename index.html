<!DOCTYPE html>
<html lang="el">

<head>

    <link
        rel="icon"
        href="/favicon.ico"
    />
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style/style.css"
    >

    <title>
        Ηπειρώτικα Χαβάδια
    </title>

</head>

<body class="story-body">

    <!-- WELCOME SECTION -->

    <section class="story-page welcome-body transition-page">

        <main class="welcome-screen">

            <h1 class="welcome-title">
                Καλώς ήρθατε!
            </h1>

            <img
                src="assets/logo/logo.png"
                alt="Χαβάδια"
                class="main-logo"
            >

            <div class="scroll-hint">
                <span>
                    Κύλησε προς τα κάτω για να ξεκινήσεις
                </span>

                <div class="scroll-arrow">  
                    ↓
                </div>
            </div>

        </main>

        <div class="page-footer">

            <div class="footer-side">

                <p class="footer-label">
                    Χορηγός
                </p>

                <img
                    src="assets/logo/bank.png"
                    class="footer-bank-logo"
                >

            </div>

            <div class="footer-side">

                <p class="footer-label">
                    Διοργάνωση
                </p>

                <img
                    src="assets/logo/logo.png"
                    class="footer-main-logo"
                >

            </div>

        </div>

    </section>

    <!-- MENU SECTION -->

    <section class="story-page transition-page">

        <main class="puzzle-grid">

            <a
                href="pages/program-menu.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Πρόγραμμα-Στίχοι
                </span>

            </a>

            <a
                href="pages/sounds-menu.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Ήχοι
                </span>

            </a>

            <a
                href="pages/credits.html"
                class="puzzle-item sound-tile"
            >

                <span>
                    Συντελεστές
                </span>

            </a>

        </main>

        <div class="page-footer">

            <div class="footer-side">

                <p class="footer-label">
                    Χορηγός
                </p>

                <img
                    src="assets/logo/bank.png"
                    class="footer-bank-logo"
                >

            </div>

            <div class="footer-side">

                <p class="footer-label">
                    Διοργάνωση
                </p>

                <img
                    src="assets/logo/logo.png"
                    class="footer-main-logo"
                >

            </div>

        </div>

    </section>

    <div
        class="newsletter-modal"
        id="newsletterModal"
    >

        <div class="newsletter-box">

            <h2>
                Ηπειρώτικα Χαβάδια
            </h2>

            <p>
                Θέλετε να ενημερώνεστε
                για μελλοντικές παραστάσεις
                και εκδηλώσεις;
            </p>

            <input
                type="email"
                id="newsletterInput"
                placeholder="example@email.com"
            >

            <div class="newsletter-consent">

                <input
                    type="checkbox"
                    id="newsletterConsent"
                >

                <label for="newsletterConsent">

                    Δέχομαι να λαμβάνω
                    ενημερωτικά emails

                </label>

            </div>

            <a
                href="/pages/privacy.html"
                class="privacy-link"
            >

                Πολιτική Απορρήτου

            </a>

            <button
                id="newsletterBtn"
            >
                Εγγραφή
            </button>

            <button
                id="newsletterClose"
                class="skip-btn"
            >
                Συνέχεια χωρίς εγγραφή
            </button>

            <p
                class="newsletter-message"
                id="newsletterMessage"
            ></p>

        </div>

    </div>

    <script
        src="scripts/newsletter.js"
    ></script>

    <script>

    if (
        'serviceWorker'
        in navigator
    ) {

        window.addEventListener(
            'load',
            () => {

                navigator
                    .serviceWorker
                    .register(
                        '/sw.js'
                    )
                    .catch(
                        console.error
                    );
            }
        );
    }

    </script>
</body>

</html>
